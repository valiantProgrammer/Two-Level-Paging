<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 12" width="100%" height="100%" role="img" aria-labelledby="divTitle divDesc">
  <title id="divTitle">Gradient Divider</title>
  <desc id="divDesc">Animated gradient neon accent divider line.</desc>

  <defs>
    <linearGradient id="divGrad" x1="-100%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.1" />
      <stop offset="25%" stop-color="#8b5cf6" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="1" />
      <stop offset="75%" stop-color="#8b5cf6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.1" />
      <animate attributeName="x1" from="-100%" to="100%" dur="5s" repeatCount="indefinite" />
      <animate attributeName="x2" from="100%" to="300%" dur="5s" repeatCount="indefinite" />
    </linearGradient>
  </defs>

  <rect y="4" width="1200" height="3" rx="1.5" fill="url(#divGrad)" />
  <circle cx="600" cy="5.5" r="3" fill="#06b6d4" opacity="0.9" />
</svg>
