<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="100%" height="100%" role="img" aria-labelledby="addrTitle addrDesc">
  <title id="addrTitle">32-Bit Address Breakdown &amp; Bit Extraction</title>
  <desc id="addrDesc">Register breakdown of 32-bit virtual address into 10-bit Directory, 10-bit Table, and 12-bit Offset with bitwise formulas and binary values.</desc>

  <defs>
    <linearGradient id="abBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c16" />
      <stop offset="50%" stop-color="#12162e" />
      <stop offset="100%" stop-color="#080a14" />
    </linearGradient>

    <!-- Segment Gradients -->
    <linearGradient id="segDir" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>

    <linearGradient id="segTbl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <linearGradient id="segOff" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0e7490" />
    </linearGradient>
  </defs>

  <style>
    @keyframes highlightSeq {
      0%, 100% { opacity: 0.85; filter: drop-shadow(0 0 2px transparent); }
      33% { opacity: 1; filter: drop-shadow(0 0 10px rgba(139, 92, 246, 0.7)); }
      66% { opacity: 1; filter: drop-shadow(0 0 10px rgba(59, 130, 246, 0.7)); }
      99% { opacity: 1; filter: drop-shadow(0 0 10px rgba(6, 182, 212, 0.7)); }
    }
    .reg-title { font-family: 'Inter', system-ui, sans-serif; font-size: 13.5px; font-weight: 700; fill: #f8fafc; }
    .mono-head { font-family: 'Fira Code', ui-monospace, monospace; font-size: 12px; font-weight: 700; fill: #ffffff; }
    .mono-bin { font-family: 'Fira Code', ui-monospace, monospace; font-size: 12.5px; font-weight: 700; letter-spacing: 1.5px; }
    .mono-eq { font-family: 'Fira Code', ui-monospace, monospace; font-size: 10.5px; fill: #cbd5e1; }
    .tick-num { font-family: 'Fira Code', ui-monospace, monospace; font-size: 9.5px; font-weight: 600; fill: #94a3b8; }
  </style>

  <!-- Background Panel -->
  <rect width="1000" height="260" rx="12" fill="url(#abBg)" stroke="rgba(139, 92, 246, 0.35)" stroke-width="1.2" />

  <!-- Title & Worked Example Header -->
  <g transform="translate(30, 28)">
    <rect width="20" height="20" rx="4" fill="#8b5cf6" />
    <text x="10" y="14" text-anchor="middle" font-family="'Fira Code', monospace" font-size="12" font-weight="900" fill="#ffffff">#</text>
    <text x="28" y="15" class="reg-title">32-Bit Virtual Address Breakdown</text>
    <text x="270" y="15" font-family="'Fira Code', monospace" font-size="11.5" fill="#38bdf8">Worked Example: VA = 0x00012345 (Decimal: 74,565)</text>
  </g>

  <!-- Bit Index Ruler -->
  <g transform="translate(30, 52)">
    <!-- 31 - 22 ticks -->
    <text x="4" y="0" class="tick-num">31</text>
    <line x1="10" y1="4" x2="10" y2="9" stroke="#64748b" stroke-width="1.2" />
    <text x="290" y="0" class="tick-num">22</text>
    <line x1="298" y1="4" x2="298" y2="9" stroke="#64748b" stroke-width="1.2" />

    <!-- 21 - 12 ticks -->
    <text x="325" y="0" class="tick-num">21</text>
    <line x1="331" y1="4" x2="331" y2="9" stroke="#64748b" stroke-width="1.2" />
    <text x="610" y="0" class="tick-num">12</text>
    <line x1="619" y1="4" x2="619" y2="9" stroke="#64748b" stroke-width="1.2" />

    <!-- 11 - 0 ticks -->
    <text x="645" y="0" class="tick-num">11</text>
    <line x1="652" y1="4" x2="652" y2="9" stroke="#64748b" stroke-width="1.2" />
    <text x="930" y="0" class="tick-num">0</text>
    <line x1="935" y1="4" x2="935" y2="9" stroke="#64748b" stroke-width="1.2" />
  </g>

  <!-- 32-Bit Register Bar -->
  <g transform="translate(30, 66)">
    <!-- Segment 1: Directory (10 bits, 300px) -->
    <g transform="translate(0, 0)">
      <rect width="308" height="64" rx="7" fill="url(#segDir)" stroke="#a855f7" stroke-width="1.5">
        <animate attributeName="stroke-width" values="1.5;3;1.5;1.5" dur="6s" repeatCount="indefinite" />
      </rect>
      <text x="16" y="24" class="mono-head">Directory Index (10 bits)</text>
      <text x="16" y="44" class="mono-bin" fill="#f5d0fe">0000000000</text>
      <rect x="230" y="14" width="64" height="24" rx="4" fill="rgba(15, 23, 42, 0.6)" />
      <text x="262" y="30" text-anchor="middle" font-family="'Fira Code', monospace" font-size="11.5" font-weight="700" fill="#ffffff">0x0 (0)</text>
    </g>

    <!-- Segment 2: Table (10 bits, 308px) -->
    <g transform="translate(318, 0)">
      <rect width="308" height="64" rx="7" fill="url(#segTbl)" stroke="#60a5fa" stroke-width="1.5">
        <animate attributeName="stroke-width" values="1.5;1.5;3;1.5" dur="6s" repeatCount="indefinite" />
      </rect>
      <text x="16" y="24" class="mono-head">Page Table Index (10 bits)</text>
      <text x="16" y="44" class="mono-bin" fill="#bfdbfe">0000010010</text>
      <rect x="225" y="14" width="70" height="24" rx="4" fill="rgba(15, 23, 42, 0.6)" />
      <text x="260" y="30" text-anchor="middle" font-family="'Fira Code', monospace" font-size="11.5" font-weight="700" fill="#ffffff">0x12 (18)</text>
    </g>

    <!-- Segment 3: Offset (12 bits, 314px) -->
    <g transform="translate(636, 0)">
      <rect width="304" height="64" rx="7" fill="url(#segOff)" stroke="#22d3ee" stroke-width="1.5">
        <animate attributeName="stroke-width" values="1.5;1.5;1.5;3" dur="6s" repeatCount="indefinite" />
      </rect>
      <text x="16" y="24" class="mono-head">Page Offset (12 bits)</text>
      <text x="16" y="44" class="mono-bin" fill="#cffafe">001101000101</text>
      <rect x="215" y="14" width="76" height="24" rx="4" fill="rgba(15, 23, 42, 0.6)" />
      <text x="253" y="30" text-anchor="middle" font-family="'Fira Code', monospace" font-size="11.5" font-weight="700" fill="#ffffff">0x345 (837)</text>
    </g>
  </g>

  <!-- Bitwise Formula Extraction Cards -->
  <g transform="translate(30, 142)">
    <!-- Card 1: Dir Formula -->
    <g transform="translate(0, 0)">
      <rect width="308" height="48" rx="6" fill="rgba(139, 92, 246, 0.12)" stroke="rgba(139, 92, 246, 0.35)" />
      <text x="12" y="20" class="mono-eq" fill="#c4b5fd">dir = (VA &gt;&gt; 22) &amp; 0x3FF</text>
      <text x="12" y="36" class="mono-eq" fill="#e2e8f0">= (74565 &gt;&gt; 22) &amp; 1023 = <tspan font-weight="700" fill="#a855f7">0x0 (0)</tspan></text>
    </g>

    <!-- Card 2: Table Formula -->
    <g transform="translate(318, 0)">
      <rect width="308" height="48" rx="6" fill="rgba(59, 130, 246, 0.12)" stroke="rgba(59, 130, 246, 0.35)" />
      <text x="12" y="20" class="mono-eq" fill="#93c5fd">table = (VA &gt;&gt; 12) &amp; 0x3FF</text>
      <text x="12" y="36" class="mono-eq" fill="#e2e8f0">= (74565 &gt;&gt; 12) &amp; 1023 = <tspan font-weight="700" fill="#60a5fa">0x12 (18)</tspan></text>
    </g>

    <!-- Card 3: Offset Formula -->
    <g transform="translate(636, 0)">
      <rect width="304" height="48" rx="6" fill="rgba(6, 182, 212, 0.12)" stroke="rgba(6, 182, 212, 0.35)" />
      <text x="12" y="20" class="mono-eq" fill="#67e8f9">offset = VA &amp; 0xFFF</text>
      <text x="12" y="36" class="mono-eq" fill="#e2e8f0">= 74565 &amp; 4095 = <tspan font-weight="700" fill="#22d3ee">0x345 (837)</tspan></text>
    </g>
  </g>

  <!-- Bottom Final Physical Address Formula Banner -->
  <g transform="translate(30, 202)">
    <rect width="940" height="44" rx="7" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="1.2" />
    <circle cx="20" cy="22" r="5" fill="#10b981" />
    <text x="34" y="26" font-family="'Fira Code', monospace" font-size="11.5" font-weight="700" fill="#ffffff">
      Physical Address Assembly:
      <tspan fill="#34d399">PA = (Frame &lt;&lt; 12) | Offset</tspan>
      <tspan fill="#cbd5e1">➜ (0x3 &lt;&lt; 12) | 0x345 = 0x00003000 | 0x345 = </tspan>
      <tspan fill="#10b981" font-weight="800">0x00003345 (13,125)</tspan>
    </text>
  </g>
</svg>
