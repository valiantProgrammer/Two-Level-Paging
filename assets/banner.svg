<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b18" />
      <stop offset="50%" stop-color="#0e1329" />
      <stop offset="100%" stop-color="#070a14" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="tlbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <linearGradient id="ptGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#581c87" />
    </linearGradient>

    <linearGradient id="ramGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <radialGradient id="glowPurple" cx="20%" cy="25%" r="40%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowCyan" cx="80%" cy="75%" r="45%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <!-- Filter for soft neon glow -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; font-size: 42px; fill: #ffffff; letter-spacing: -0.5px; }
    .subtitle-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 400; font-size: 16px; fill: #94a3b8; }
    .tag-text { font-family: 'Fira Code', 'SF Mono', Consolas, monospace; font-size: 11px; font-weight: 600; fill: #c4b5fd; }
    .badge-label { font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 600; fill: #e2e8f0; }
    .mono-code { font-family: 'Fira Code', monospace; font-size: 11.5px; fill: #38bdf8; }
    .card-title { font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 700; fill: #f8fafc; text-transform: uppercase; letter-spacing: 0.5px; }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="400" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="400" fill="url(#glowPurple)" />
  <rect width="1200" height="400" fill="url(#glowCyan)" />

  <!-- Outer Border -->
  <rect x="1" y="1" width="1198" height="398" rx="15" fill="none" stroke="rgba(139, 92, 246, 0.3)" stroke-width="1.5" />

  <!-- Grid Pattern Overlay -->
  <g opacity="0.12" stroke="#6366f1" stroke-width="0.8">
    <line x1="0" y1="50" x2="1200" y2="50" />
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="150" x2="1200" y2="150" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="250" x2="1200" y2="250" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="350" x2="1200" y2="350" />

    <line x1="100" y1="0" x2="100" y2="400" />
    <line x1="250" y1="0" x2="250" y2="400" />
    <line x1="400" y1="0" x2="400" y2="400" />
    <line x1="550" y1="0" x2="550" y2="400" />
    <line x1="700" y1="0" x2="700" y2="400" />
    <line x1="850" y1="0" x2="850" y2="400" />
    <line x1="1000" y1="0" x2="1000" y2="400" />
  </g>

  <!-- Left Column: Branding and Text Content -->
  <g transform="translate(60, 55)">
    <!-- Pill Badge -->
    <g transform="translate(0, 0)">
      <rect width="260" height="28" rx="14" fill="rgba(139, 92, 246, 0.15)" stroke="rgba(139, 92, 246, 0.45)" stroke-width="1" />
      <circle cx="14" cy="14" r="4" fill="#34d399" />
      <text x="26" y="18" class="tag-text">OS VIRTUAL MEMORY SIMULATOR</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="68" class="title-text">Two-Level Paging</text>
    <text x="0" y="112" class="title-text">
      <tspan fill="#94a3b8">&amp; </tspan>
      <tspan fill="url(#primaryGrad)">TLB Engine</tspan>
    </text>

    <!-- Subtitle -->
    <text x="0" y="148" class="subtitle-text">
      Interactive Hardware Address Translation Architecture with Demand Paging,
    </text>
    <text x="0" y="172" class="subtitle-text">
      LRU Translation Lookaside Buffer, and FIFO Physical Frame Allocation.
    </text>

    <!-- Feature Tag Badges -->
    <g transform="translate(0, 208)">
      <!-- Badge 1: 32-bit Architecture -->
      <g transform="translate(0, 0)">
        <rect width="138" height="32" rx="6" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(59, 130, 246, 0.4)" />
        <circle cx="16" cy="16" r="3.5" fill="#38bdf8" />
        <text x="28" y="20" class="badge-label">32-bit VA Space</text>
      </g>

      <!-- Badge 2: 10-10-12 Split -->
      <g transform="translate(148, 0)">
        <rect width="124" height="32" rx="6" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(139, 92, 246, 0.4)" />
        <circle cx="16" cy="16" r="3.5" fill="#a855f7" />
        <text x="28" y="20" class="badge-label">10-10-12 Paging</text>
      </g>

      <!-- Badge 3: TLB LRU -->
      <g transform="translate(282, 0)">
        <rect width="112" height="32" rx="6" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(16, 185, 129, 0.4)" />
        <circle cx="16" cy="16" r="3.5" fill="#10b981" />
        <text x="28" y="20" class="badge-label">TLB (LRU)</text>
      </g>

      <!-- Badge 4: FIFO Frames -->
      <g transform="translate(404, 0)">
        <rect width="120" height="32" rx="6" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(245, 158, 11, 0.4)" />
        <circle cx="16" cy="16" r="3.5" fill="#fbbf24" />
        <text x="28" y="20" class="badge-label">FIFO Frames</text>
      </g>
    </g>

    <!-- Bottom Specs Line -->
    <g transform="translate(0, 268)">
      <text x="0" y="0" class="mono-code">VA (32-bit) = [ Dir: 10b | Table: 10b | Offset: 12b ]  ➜  PA = (PFN &lt;&lt; 12) | Offset</text>
    </g>
  </g>

  <!-- Right Column: Interactive Micro-Flow Diagram Mockup -->
  <g transform="translate(680, 50)">
    <!-- Main Card Container -->
    <rect width="460" height="300" rx="14" fill="rgba(15, 20, 40, 0.85)" stroke="rgba(139, 92, 246, 0.35)" stroke-width="1.5" />

    <!-- Top Card Header -->
    <rect x="0" y="0" width="460" height="42" rx="14" fill="rgba(19, 24, 48, 0.9)" />
    <circle cx="22" cy="21" r="5" fill="#ef4444" />
    <circle cx="38" cy="21" r="5" fill="#f59e0b" />
    <circle cx="54" cy="21" r="5" fill="#10b981" />
    <text x="76" y="25" class="card-title">Memory Hierarchy Pipeline</text>

    <!-- Virtual Address Decomposition Box -->
    <g transform="translate(20, 58)">
      <rect width="420" height="46" rx="8" fill="rgba(11, 15, 30, 0.9)" stroke="rgba(255, 255, 255, 0.1)" />
      
      <!-- Dir 10b -->
      <rect x="6" y="6" width="130" height="34" rx="5" fill="rgba(99, 102, 241, 0.15)" stroke="#6366f1" stroke-width="1" />
      <text x="71" y="21" text-anchor="middle" font-family="'Fira Code', monospace" font-size="11" font-weight="700" fill="#a5b4fc">Dir [31:22]</text>
      <text x="71" y="33" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#94a3b8">10 bits (1024)</text>

      <!-- Table 10b -->
      <rect x="144" y="6" width="130" height="34" rx="5" fill="rgba(168, 85, 247, 0.15)" stroke="#a855f7" stroke-width="1" />
      <text x="209" y="21" text-anchor="middle" font-family="'Fira Code', monospace" font-size="11" font-weight="700" fill="#d8b4fe">Table [21:12]</text>
      <text x="209" y="33" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#94a3b8">10 bits (1024)</text>

      <!-- Offset 12b -->
      <rect x="282" y="6" width="132" height="34" rx="5" fill="rgba(6, 182, 212, 0.15)" stroke="#06b6d4" stroke-width="1" />
      <text x="348" y="21" text-anchor="middle" font-family="'Fira Code', monospace" font-size="11" font-weight="700" fill="#67e8f9">Offset [11:0]</text>
      <text x="348" y="33" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#94a3b8">12 bits (4 KiB)</text>
    </g>

    <!-- Pipeline Stages Horizontal Blocks -->
    <g transform="translate(20, 118)">
      <!-- Stage 1: TLB -->
      <g transform="translate(0, 0)">
        <rect width="95" height="105" rx="8" fill="rgba(59, 130, 246, 0.1)" stroke="rgba(59, 130, 246, 0.4)" />
        <rect x="0" y="0" width="95" height="24" rx="8" fill="rgba(59, 130, 246, 0.25)" />
        <text x="47" y="16" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#93c5fd">1. TLB</text>
        <text x="47" y="44" text-anchor="middle" font-family="'Fira Code', monospace" font-size="9.5" fill="#38bdf8">VPN ➜ PFN</text>
        <rect x="12" y="56" width="71" height="18" rx="4" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981" />
        <text x="47" y="69" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#34d399">Hit: 110ns</text>
        <text x="47" y="94" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#94a3b8">4 Slots (LRU)</text>
      </g>

      <!-- Arrow 1 -->
      <path d="M 100 52 L 108 52" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />

      <!-- Stage 2: Page Directory -->
      <g transform="translate(112, 0)">
        <rect width="95" height="105" rx="8" fill="rgba(139, 92, 246, 0.1)" stroke="rgba(139, 92, 246, 0.4)" />
        <rect x="0" y="0" width="95" height="24" rx="8" fill="rgba(139, 92, 246, 0.25)" />
        <text x="47" y="16" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#c4b5fd">2. Directory</text>
        <text x="47" y="44" text-anchor="middle" font-family="'Fira Code', monospace" font-size="9.5" fill="#d8b4fe">PDE Entry</text>
        <rect x="12" y="56" width="71" height="18" rx="4" fill="rgba(139, 92, 246, 0.2)" stroke="#8b5cf6" />
        <text x="47" y="69" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#c4b5fd">PT Base</text>
        <text x="47" y="94" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#94a3b8">1024 PDEs</text>
      </g>

      <!-- Arrow 2 -->
      <path d="M 212 52 L 220 52" stroke="#64748b" stroke-width="1.5" />

      <!-- Stage 3: Page Table -->
      <g transform="translate(224, 0)">
        <rect width="95" height="105" rx="8" fill="rgba(236, 72, 153, 0.1)" stroke="rgba(236, 72, 153, 0.4)" />
        <rect x="0" y="0" width="95" height="24" rx="8" fill="rgba(236, 72, 153, 0.25)" />
        <text x="47" y="16" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#f472b6">3. Page Table</text>
        <text x="47" y="44" text-anchor="middle" font-family="'Fira Code', monospace" font-size="9.5" fill="#f472b6">PTE Entry</text>
        <rect x="12" y="56" width="71" height="18" rx="4" fill="rgba(236, 72, 153, 0.2)" stroke="#ec4899" />
        <text x="47" y="69" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#f472b6">Frame #</text>
        <text x="47" y="94" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#94a3b8">1024 PTEs</text>
      </g>

      <!-- Arrow 3 -->
      <path d="M 324 52 L 332 52" stroke="#64748b" stroke-width="1.5" />

      <!-- Stage 4: Physical RAM -->
      <g transform="translate(336, 0)">
        <rect width="84" height="105" rx="8" fill="rgba(16, 185, 129, 0.1)" stroke="rgba(16, 185, 129, 0.4)" />
        <rect x="0" y="0" width="84" height="24" rx="8" fill="rgba(16, 185, 129, 0.25)" />
        <text x="42" y="16" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#6ee7b7">4. RAM</text>
        <text x="42" y="44" text-anchor="middle" font-family="'Fira Code', monospace" font-size="9" fill="#34d399">Physical PA</text>
        <rect x="8" y="56" width="68" height="18" rx="4" fill="rgba(16, 185, 129, 0.25)" stroke="#10b981" />
        <text x="42" y="69" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#34d399">PFN|Offset</text>
        <text x="42" y="94" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#94a3b8">FIFO Queue</text>
      </g>
    </g>

    <!-- Bottom Result Bar -->
    <g transform="translate(20, 238)">
      <rect width="420" height="46" rx="8" fill="rgba(18, 24, 46, 0.95)" stroke="rgba(52, 211, 153, 0.4)" />
      <circle cx="20" cy="23" r="5" fill="#34d399" />
      <text x="34" y="27" font-family="'Fira Code', monospace" font-size="11.5" font-weight="700" fill="#ffffff">
        Effective Access Time: <tspan fill="#34d399">EAT = h·T_tlb + (1-h)·T_mem</tspan>
      </text>
    </g>
  </g>
</svg>
