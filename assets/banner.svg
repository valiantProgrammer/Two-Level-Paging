<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%" role="img" aria-labelledby="bannerTitle bannerDesc">
  <title id="bannerTitle">Two-Level Paging + TLB Simulator Banner</title>
  <desc id="bannerDesc">Animated header banner featuring isometric layered memory logo, drifting hexadecimal stream, and glowing typography.</desc>

  <defs>
    <!-- Dark Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c16" />
      <stop offset="50%" stop-color="#12162e" />
      <stop offset="100%" stop-color="#070913" />
    </linearGradient>

    <!-- Moving Title Shine Gradient -->
    <linearGradient id="shineGrad" x1="-100%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="75%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ffffff" />
      <animate attributeName="x1" from="-100%" to="100%" dur="7s" repeatCount="indefinite" />
      <animate attributeName="x2" from="100%" to="300%" dur="7s" repeatCount="indefinite" />
    </linearGradient>

    <!-- Isometric Layer Gradients -->
    <linearGradient id="layerTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0891b2" />
    </linearGradient>

    <linearGradient id="layerMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>

    <linearGradient id="layerBot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="logoGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="cyanGlow" cx="90%" cy="20%" r="40%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <!-- Soft Filter -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes floatLayer {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.1); }
    }
    @keyframes driftStream {
      0% { transform: translateY(0px); opacity: 0.15; }
      50% { opacity: 0.3; }
      100% { transform: translateY(-160px); opacity: 0.05; }
    }
    .iso-group { animation: floatLayer 4s ease-in-out infinite; transform-origin: center; }
    .pulse-bg { animation: pulseGlow 4s ease-in-out infinite; transform-origin: 140px 150px; }
    .stream-col { font-family: 'Fira Code', ui-monospace, monospace; font-size: 11px; fill: #6366f1; animation: driftStream 12s linear infinite; }
    .stream-col-fast { font-family: 'Fira Code', ui-monospace, monospace; font-size: 11px; fill: #06b6d4; animation: driftStream 8s linear infinite; }
    .main-title { font-family: 'Inter', system-ui, sans-serif; font-size: 38px; font-weight: 800; letter-spacing: -0.5px; }
    .sub-title { font-family: 'Inter', system-ui, sans-serif; font-size: 15px; font-weight: 500; fill: #94a3b8; }
    .badge-txt { font-family: 'Fira Code', ui-monospace, monospace; font-size: 11px; font-weight: 600; fill: #c4b5fd; }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="300" rx="14" fill="url(#bgGrad)" />
  <rect width="1200" height="300" fill="url(#cyanGlow)" />
  <rect x="1" y="1" width="1198" height="298" rx="13" fill="none" stroke="rgba(139, 92, 246, 0.35)" stroke-width="1.5" />

  <!-- Background Grid -->
  <g opacity="0.08" stroke="#8b5cf6" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="120" y1="0" x2="120" y2="300" />
    <line x1="240" y1="0" x2="240" y2="300" />
    <line x1="360" y1="0" x2="360" y2="300" />
    <line x1="480" y1="0" x2="480" y2="300" />
    <line x1="600" y1="0" x2="600" y2="300" />
    <line x1="720" y1="0" x2="720" y2="300" />
    <line x1="840" y1="0" x2="840" y2="300" />
    <line x1="960" y1="0" x2="960" y2="300" />
    <line x1="1080" y1="0" x2="1080" y2="300" />
  </g>

  <!-- Background Drifting Binary & Hex Stream -->
  <g opacity="0.25">
    <g class="stream-col" transform="translate(680, 220)">
      <text x="0" y="0">0x00012345 ➜ VPN 0x12</text>
      <text x="0" y="24">PTE[0x12] = Frame 0x3</text>
      <text x="0" y="48">PA = 0x00003345</text>
      <text x="0" y="72">TLB Hit: 110 ns</text>
      <text x="0" y="96">0x00456789 ➜ Fault</text>
      <text x="0" y="120">FIFO Evict VPN 0x8</text>
      <text x="0" y="144">EAT = 4.0001 ms</text>
    </g>
    <g class="stream-col-fast" transform="translate(930, 250)">
      <text x="0" y="0">10-10-12 SPLIT</text>
      <text x="0" y="24">0000000000 0000010010</text>
      <text x="0" y="48">CR3 ➜ PDE[0x0]</text>
      <text x="0" y="72">PT0 Base ➜ PTE[0x12]</text>
      <text x="0" y="96">PFN: 0x3 | Off: 0x345</text>
      <text x="0" y="120">TLB 4-Way LRU</text>
      <text x="0" y="144">Demand Paging 4KiB</text>
    </g>
  </g>

  <!-- Left: Animated Layered Isometric Logo -->
  <g transform="translate(70, 45)">
    <!-- Glow Backdrop -->
    <circle cx="70" cy="105" r="90" fill="url(#logoGlow)" class="pulse-bg" />

    <g class="iso-group">
      <!-- Bottom Layer (Physical RAM - Indigo) -->
      <g transform="translate(10, 140)">
        <polygon points="60 0, 120 32, 60 64, 0 32" fill="url(#layerBot)" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
        <polygon points="0 32, 60 64, 60 80, 0 48" fill="#312e81" />
        <polygon points="120 32, 60 64, 60 80, 120 48" fill="#1e1b4b" />
      </g>

      <!-- Middle Layer (Page Tables - Violet) -->
      <g transform="translate(10, 100)">
        <polygon points="60 0, 120 32, 60 64, 0 32" fill="url(#layerMid)" stroke="rgba(255,255,255,0.3)" stroke-width="1" />
        <polygon points="0 32, 60 64, 60 80, 0 48" fill="#4c1d95" />
        <polygon points="120 32, 60 64, 60 80, 120 48" fill="#2e1065" />
      </g>

      <!-- Top Layer (TLB Cache - Cyan) -->
      <g transform="translate(10, 60)">
        <polygon points="60 0, 120 32, 60 64, 0 32" fill="url(#layerTop)" stroke="rgba(255,255,255,0.4)" stroke-width="1.2" />
        <polygon points="0 32, 60 64, 60 80, 0 48" fill="#0e7490" />
        <polygon points="120 32, 60 64, 60 80, 120 48" fill="#155e75" />
        <!-- Top Face Circuit Marker -->
        <circle cx="60" cy="32" r="5" fill="#ffffff" opacity="0.9" filter="url(#glowFilter)" />
        <line x1="35" y1="20" x2="52" y2="28" stroke="#ffffff" stroke-width="1.5" opacity="0.7" />
        <line x1="85" y1="20" x2="68" y2="28" stroke="#ffffff" stroke-width="1.5" opacity="0.7" />
      </g>
    </g>
  </g>

  <!-- Right/Center: Title, Subtitle, and Pills -->
  <g transform="translate(240, 68)">
    <!-- Pill Badge -->
    <g transform="translate(0, 0)">
      <rect width="250" height="26" rx="13" fill="rgba(139, 92, 246, 0.15)" stroke="rgba(139, 92, 246, 0.45)" stroke-width="1" />
      <circle cx="13" cy="13" r="4" fill="#10b981">
        <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="24" y="17" class="badge-txt">OS MINI-PROJECT · GROUP 6</text>
    </g>

    <!-- Main Title with Sweep Animation -->
    <text x="0" y="65" class="main-title" fill="url(#shineGrad)">Two-Level Paging + TLB Simulator</text>

    <!-- Subtitle -->
    <text x="0" y="100" class="sub-title">Virtual → Physical Address Translation · Operating Systems</text>

    <!-- Specs Pills Row -->
    <g transform="translate(0, 125)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="130" height="30" rx="6" fill="rgba(18, 22, 46, 0.85)" stroke="rgba(99, 102, 241, 0.4)" />
        <text x="14" y="19" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#a5b4fc">32-Bit Paging</text>
      </g>

      <!-- Pill 2 -->
      <g transform="translate(140, 0)">
        <rect width="138" height="30" rx="6" fill="rgba(18, 22, 46, 0.85)" stroke="rgba(139, 92, 246, 0.4)" />
        <text x="14" y="19" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#c4b5fd">10-10-12 Split</text>
      </g>

      <!-- Pill 3 -->
      <g transform="translate(288, 0)">
        <rect width="130" height="30" rx="6" fill="rgba(18, 22, 46, 0.85)" stroke="rgba(6, 182, 212, 0.4)" />
        <text x="14" y="19" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#67e8f9">4-Way TLB (LRU)</text>
      </g>

      <!-- Pill 4 -->
      <g transform="translate(428, 0)">
        <rect width="138" height="30" rx="6" fill="rgba(18, 22, 46, 0.85)" stroke="rgba(16, 185, 129, 0.4)" />
        <text x="14" y="19" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#6ee7b7">FIFO Frame Alloc</text>
      </g>

      <!-- Pill 5 -->
      <g transform="translate(576, 0)">
        <rect width="128" height="30" rx="6" fill="rgba(18, 22, 46, 0.85)" stroke="rgba(245, 158, 11, 0.4)" />
        <text x="14" y="19" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#fde68a">EAT Analytics</text>
      </g>
    </g>
  </g>
</svg>
