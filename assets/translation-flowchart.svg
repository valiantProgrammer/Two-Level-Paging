<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="flowBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b18" />
      <stop offset="50%" stop-color="#0e1329" />
      <stop offset="100%" stop-color="#070a14" />
    </linearGradient>

    <!-- Block Gradients -->
    <linearGradient id="nodeBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <linearGradient id="nodePurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#5b21b6" />
    </linearGradient>

    <linearGradient id="nodeDiamond" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <linearGradient id="nodeGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <linearGradient id="nodeRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>

    <!-- Markers -->
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#94a3b8" />
    </marker>
    <marker id="arrowG" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#10b981" />
    </marker>
    <marker id="arrowR" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ef4444" />
    </marker>
  </defs>

  <style>
    .f-title { font-family: 'Inter', sans-serif; font-size: 20px; font-weight: 800; fill: #ffffff; }
    .f-sub { font-family: 'Inter', sans-serif; font-size: 12px; fill: #94a3b8; }
    .f-node-title { font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
    .f-node-desc { font-family: 'Fira Code', monospace; font-size: 10px; fill: #e2e8f0; text-anchor: middle; }
    .f-dec-text { font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 800; fill: #ffffff; text-anchor: middle; }
    .f-branch { font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 700; }
    .branch-yes { fill: #34d399; }
    .branch-no { fill: #f87171; }
  </style>

  <!-- Background -->
  <rect width="1000" height="580" rx="14" fill="url(#flowBg)" stroke="rgba(139, 92, 246, 0.3)" stroke-width="1.5" />

  <!-- Header -->
  <g transform="translate(40, 32)">
    <text x="0" y="20" class="f-title">Address Translation &amp; Page Fault Decision Flowchart</text>
    <text x="0" y="38" class="f-sub">Hardware TLB lookup, MMU two-level table walk, and Operating System Demand Paging fault recovery</text>
  </g>

  <!-- Node 1: CPU Issues VA -->
  <g transform="translate(50, 100)">
    <rect width="170" height="54" rx="8" fill="url(#nodeBlue)" stroke="#60a5fa" stroke-width="1.2" />
    <text x="85" y="24" class="f-node-title">CPU Issues VA</text>
    <text x="85" y="42" class="f-node-desc">32-bit Virtual Address</text>
  </g>

  <!-- Arrow 1 -> Decision 1 -->
  <path d="M 220 127 L 275 127" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Decision 1: TLB Hit? -->
  <g transform="translate(285, 127)">
    <polygon points="0 -35, 55 0, 0 35, -55 0" fill="url(#nodeDiamond)" stroke="#f59e0b" stroke-width="1.5" />
    <text x="0" y="-4" class="f-dec-text">TLB Hit?</text>
    <text x="0" y="12" font-family="'Fira Code', monospace" font-size="8.5" fill="#fef3c7" text-anchor="middle">LRU Check</text>
  </g>

  <!-- Branch YES from TLB Hit -> TLB Hit Fast Path -->
  <path d="M 285 92 L 285 70 L 780 70 L 780 95" stroke="#10b981" stroke-width="2" fill="none" marker-end="url(#arrowG)" />
  <text x="295" y="82" class="f-branch branch-yes">YES (Hit)</text>

  <!-- Branch NO from TLB Hit -> Page Directory Lookup -->
  <path d="M 340 127 L 395 127" stroke="#ef4444" stroke-width="2" marker-end="url(#arrowR)" />
  <text x="348" y="120" class="f-branch branch-no">NO (Miss)</text>

  <!-- Node 2: Page Directory Lookup (Level 1) -->
  <g transform="translate(405, 100)">
    <rect width="170" height="54" rx="8" fill="url(#nodePurple)" stroke="#c084fc" stroke-width="1.2" />
    <text x="85" y="24" class="f-node-title">1. Page Directory</text>
    <text x="85" y="42" class="f-node-desc">PDE = CR3 + (p1 * 4)</text>
  </g>

  <!-- Arrow 2 -> Page Table Lookup -->
  <path d="M 490 154 L 490 195" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Node 3: Page Table Lookup (Level 2) -->
  <g transform="translate(405, 205)">
    <rect width="170" height="54" rx="8" fill="url(#nodePurple)" stroke="#c084fc" stroke-width="1.2" />
    <text x="85" y="24" class="f-node-title">2. Page Table</text>
    <text x="85" y="42" class="f-node-desc">PTE = PT_Base + (p2 * 4)</text>
  </g>

  <!-- Arrow 3 -> Decision 2: Page Present? -->
  <path d="M 490 259 L 490 295" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Decision 2: Page in RAM? (Valid Bit = 1?) -->
  <g transform="translate(490, 340)">
    <polygon points="0 -40, 65 0, 0 40, -65 0" fill="url(#nodeDiamond)" stroke="#f59e0b" stroke-width="1.5" />
    <text x="0" y="-6" class="f-dec-text">Present in RAM?</text>
    <text x="0" y="12" font-family="'Fira Code', monospace" font-size="8.5" fill="#fef3c7" text-anchor="middle">Valid Bit == 1?</text>
  </g>

  <!-- Branch YES from Page in RAM -> Update TLB and form PA -->
  <path d="M 555 340 L 680 340" stroke="#10b981" stroke-width="2" marker-end="url(#arrowG)" />
  <text x="575" y="332" class="f-branch branch-yes">YES (RAM Hit)</text>

  <!-- Node 4: Update TLB (LRU) -->
  <g transform="translate(690, 313)">
    <rect width="180" height="54" rx="8" fill="rgba(139, 92, 246, 0.2)" stroke="#8b5cf6" stroke-width="1.2" />
    <text x="90" y="24" class="f-node-title">Update TLB</text>
    <text x="90" y="42" class="f-node-desc">Insert (VPN ➜ PFN)</text>
  </g>

  <!-- Path from Update TLB to PA calculation -->
  <path d="M 780 313 L 780 185" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Branch NO from Page in RAM -> Page Fault Exception -->
  <path d="M 425 340 L 310 340" stroke="#ef4444" stroke-width="2" marker-end="url(#arrowR)" />
  <text x="330" y="332" class="f-branch branch-no">NO (Page Fault)</text>

  <!-- Node 5: OS Page Fault Handler -->
  <g transform="translate(130, 313)">
    <rect width="170" height="54" rx="8" fill="url(#nodeRed)" stroke="#f87171" stroke-width="1.2" />
    <text x="85" y="24" class="f-node-title">Page Fault Trap</text>
    <text x="85" y="42" class="f-node-desc">OS Exception Handler</text>
  </g>

  <!-- Arrow down to FIFO frame check -->
  <path d="M 215 367 L 215 410" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Decision 3: Free frame available? -->
  <g transform="translate(215, 460)">
    <polygon points="0 -35, 60 0, 0 35, -60 0" fill="url(#nodeDiamond)" stroke="#f59e0b" stroke-width="1.5" />
    <text x="0" y="-4" class="f-dec-text">Free Frame?</text>
    <text x="0" y="12" font-family="'Fira Code', monospace" font-size="8.5" fill="#fef3c7" text-anchor="middle">&lt; 8 resident</text>
  </g>

  <!-- Free Frame YES -> Allocate from free queue -->
  <path d="M 275 460 L 350 460" stroke="#10b981" stroke-width="2" marker-end="url(#arrowG)" />
  <text x="285" y="452" class="f-branch branch-yes">YES</text>

  <!-- Node 6: Allocate Free Frame -->
  <g transform="translate(360, 433)">
    <rect width="160" height="54" rx="8" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981" stroke-width="1.2" />
    <text x="80" y="24" class="f-node-title">Allocate Free Frame</text>
    <text x="80" y="42" class="f-node-desc">Free pool dequeue</text>
  </g>

  <!-- Free Frame NO -> FIFO Eviction -->
  <path d="M 155 460 L 95 460 L 95 520 L 360 520" stroke="#ef4444" stroke-width="2" fill="none" marker-end="url(#arrowR)" />
  <text x="110" y="452" class="f-branch branch-no">NO (Full)</text>

  <!-- Node 7: FIFO Eviction -->
  <g transform="translate(360, 498)">
    <rect width="160" height="44" rx="8" fill="rgba(245, 158, 11, 0.2)" stroke="#f59e0b" stroke-width="1.2" />
    <text x="80" y="20" class="f-node-title">FIFO Victim Eviction</text>
    <text x="80" y="34" class="f-node-desc">Evict oldest resident VPN</text>
  </g>

  <!-- From allocation & eviction -> Disk fetch and PTE update -->
  <path d="M 520 460 L 590 460" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 520 520 L 555 520 L 555 460" stroke="#94a3b8" stroke-width="2" fill="none" />

  <!-- Node 8: Bring page from disk & set valid bit -->
  <g transform="translate(600, 433)">
    <rect width="170" height="54" rx="8" fill="rgba(14, 165, 233, 0.2)" stroke="#0ea5e9" stroke-width="1.2" />
    <text x="85" y="22" class="f-node-title">Disk Read &amp; Set PTE</text>
    <text x="85" y="38" class="f-node-desc">Load page ➜ Valid = 1</text>
  </g>

  <!-- From Node 8 back to Update TLB -->
  <path d="M 685 433 L 685 390 L 780 390 L 780 367" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrow)" />

  <!-- Node 9: Form Physical Address (PA) -->
  <g transform="translate(685, 105)">
    <rect width="190" height="66" rx="8" fill="url(#nodeGreen)" stroke="#34d399" stroke-width="1.5" />
    <text x="95" y="26" class="f-node-title">Physical Address (PA)</text>
    <text x="95" y="44" class="f-node-desc">PA = (PFN &lt;&lt; 12) | Offset</text>
    <text x="95" y="58" font-family="'Fira Code', monospace" font-size="9" fill="#a7f3d0" text-anchor="middle">Access Data in RAM</text>
  </g>
</svg>
