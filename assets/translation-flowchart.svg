<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="100%" height="100%" role="img" aria-labelledby="flowTitle flowDesc">
  <title id="flowTitle">Address Translation and Demand Paging Decision Flowchart</title>
  <desc id="flowDesc">Animated decision flowchart showing TLB lookup, Page Directory and Page Table walks, Page Fault handler, and FIFO frame eviction.</desc>

  <defs>
    <!-- Background Gradient -->
    <linearGradient id="flBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c16" />
      <stop offset="50%" stop-color="#12162e" />
      <stop offset="100%" stop-color="#070913" />
    </linearGradient>

    <!-- Node Gradients -->
    <linearGradient id="nStart" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <linearGradient id="nDecision" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <linearGradient id="nFault" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>

    <linearGradient id="nEnd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Markers -->
    <marker id="fArr" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#94a3b8" />
    </marker>
    <marker id="fArrG" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#34d399" />
    </marker>
    <marker id="fArrR" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#f87171" />
    </marker>
  </defs>

  <style>
    @keyframes flowDot {
      0% { stroke-dashoffset: 40; }
      100% { stroke-dashoffset: 0; }
    }
    .flow-line { stroke: #94a3b8; stroke-width: 1.8; fill: none; }
    .flow-anim { stroke-dasharray: 6 6; animation: flowDot 1.4s linear infinite; }
    .flow-green { stroke: #10b981; stroke-width: 2; stroke-dasharray: 6 6; animation: flowDot 1.2s linear infinite; fill: none; }
    .flow-red { stroke: #ef4444; stroke-width: 2; stroke-dasharray: 6 6; animation: flowDot 1.2s linear infinite; fill: none; }

    .node-title { font-family: 'Inter', system-ui, sans-serif; font-size: 11.5px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
    .node-desc { font-family: 'Fira Code', ui-monospace, monospace; font-size: 9.5px; fill: #e2e8f0; text-anchor: middle; }
    .diamond-txt { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; font-weight: 800; fill: #ffffff; text-anchor: middle; }
    .diamond-sub { font-family: 'Fira Code', ui-monospace, monospace; font-size: 8.5px; fill: #fef3c7; text-anchor: middle; }
    .tag-lbl { font-family: 'Inter', system-ui, sans-serif; font-size: 10px; font-weight: 800; }
  </style>

  <!-- Panel Background -->
  <rect width="1000" height="700" rx="14" fill="url(#flBg)" stroke="rgba(139, 92, 246, 0.35)" stroke-width="1.2" />

  <!-- Top Title -->
  <g transform="translate(40, 28)">
    <text x="0" y="16" font-family="'Inter', sans-serif" font-size="19px" font-weight="800" fill="#ffffff">Address Translation &amp; Page Fault Decision Flowchart</text>
    <text x="0" y="32" font-family="'Inter', sans-serif" font-size="11.5px" fill="#94a3b8">Decision graph depicting TLB cache checks, MMU hierarchical walk, demand paging, and FIFO frame eviction</text>
  </g>

  <!-- ========================================================
       ROW 1: START -> RECEIVE VA -> SPLIT ADDRESS -> TLB LOOKUP
       ======================================================== -->

  <!-- Node: Start -->
  <g transform="translate(45, 90)">
    <rect width="100" height="46" rx="23" fill="url(#nStart)" stroke="#60a5fa" stroke-width="1.2" />
    <text x="50" y="28" class="node-title">Start</text>
  </g>

  <!-- Line to Receive VA -->
  <line x1="145" y1="113" x2="185" y2="113" class="flow-line flow-anim" marker-end="url(#fArr)" />

  <!-- Node: Receive VA -->
  <g transform="translate(190, 88)">
    <rect width="160" height="50" rx="7" fill="rgba(18, 24, 48, 0.9)" stroke="rgba(99, 102, 241, 0.5)" stroke-width="1.2" />
    <text x="80" y="23" class="node-title">1. Receive 32-Bit VA</text>
    <text x="80" y="38" class="node-desc">CPU Memory Request</text>
  </g>

  <!-- Line to Split Address -->
  <line x1="350" y1="113" x2="390" y2="113" class="flow-line flow-anim" marker-end="url(#fArr)" />

  <!-- Node: Split Address -->
  <g transform="translate(395, 88)">
    <rect width="180" height="50" rx="7" fill="rgba(18, 24, 48, 0.9)" stroke="rgba(139, 92, 246, 0.5)" stroke-width="1.2" />
    <text x="90" y="23" class="node-title">2. Bitwise Address Split</text>
    <text x="90" y="38" class="node-desc">p1:10b | p2:10b | d:12b</text>
  </g>

  <!-- Line to TLB Lookup -->
  <line x1="575" y1="113" x2="620" y2="113" class="flow-line flow-anim" marker-end="url(#fArr)" />

  <!-- Decision: TLB Lookup (Hit?) -->
  <g transform="translate(680, 113)">
    <polygon points="0 -34, 58 0, 0 34, -58 0" fill="url(#nDecision)" stroke="#fbbf24" stroke-width="1.5" />
    <text x="0" y="-4" class="diamond-txt">TLB Hit?</text>
    <text x="0" y="12" class="diamond-sub">LRU Cache</text>
  </g>

  <!-- ========================================================
       TLB HIT PATH (FAST PATH -> END)
       ======================================================== -->
  <!-- Line: TLB Hit (YES) Up & Right -->
  <path d="M 680 79 L 680 62 L 850 62 L 850 85" class="flow-green" marker-end="url(#fArrG)" />
  <text x="690" y="72" class="tag-lbl" fill="#34d399">YES (Hit)</text>

  <!-- Node: Get PFN from TLB & Mark MRU -->
  <g transform="translate(765, 88)">
    <rect width="170" height="50" rx="7" fill="rgba(16, 185, 129, 0.18)" stroke="#10b981" stroke-width="1.2" />
    <text x="85" y="22" class="node-title" fill="#a7f3d0">Obtain PFN &amp; MRU</text>
    <text x="85" y="38" class="node-desc" fill="#6ee7b7">Latency: 110 ns</text>
  </g>

  <!-- Line down to Form PA -->
  <line x1="850" y1="138" x2="850" y2="185" class="flow-green" marker-end="url(#fArrG)" />

  <!-- Node: Form Physical Address -->
  <g transform="translate(755, 188)">
    <rect width="190" height="60" rx="8" fill="url(#nEnd)" stroke="#34d399" stroke-width="1.5" />
    <text x="95" y="24" class="node-title">Form Physical Address</text>
    <text x="95" y="39" class="node-desc">PA = (PFN &lt;&lt; 12) | d</text>
    <text x="95" y="52" class="node-desc" fill="#a7f3d0">Access RAM Data</text>
  </g>

  <!-- Line to End -->
  <line x1="850" y1="248" x2="850" y2="280" class="flow-green" marker-end="url(#fArrG)" />
  <g transform="translate(805, 280)">
    <rect width="90" height="36" rx="18" fill="url(#nEnd)" stroke="#34d399" stroke-width="1.2" />
    <text x="45" y="23" class="node-title">End</text>
  </g>

  <!-- ========================================================
       TLB MISS PATH (PAGE-TABLE WALK)
       ======================================================== -->
  <!-- Line: TLB Miss (NO) Downwards -->
  <line x1="680" y1="147" x2="680" y2="188" class="flow-red" marker-end="url(#fArrR)" />
  <text x="690" y="168" class="tag-lbl" fill="#f87171">NO (Miss)</text>

  <!-- Node: Page Directory Lookup -->
  <g transform="translate(585, 190)">
    <rect width="190" height="50" rx="7" fill="rgba(18, 24, 48, 0.9)" stroke="rgba(6, 182, 212, 0.5)" stroke-width="1.2" />
    <text x="95" y="22" class="node-title">3. Page Directory Walk</text>
    <text x="95" y="38" class="node-desc">CR3 + (p1 * 4) ➜ PDE</text>
  </g>

  <!-- Line down to Page Table Lookup -->
  <line x1="680" y1="240" x2="680" y2="280" class="flow-line flow-anim" marker-end="url(#fArr)" />

  <!-- Node: Page Table Lookup -->
  <g transform="translate(585, 282)">
    <rect width="190" height="50" rx="7" fill="rgba(18, 24, 48, 0.9)" stroke="rgba(168, 85, 247, 0.5)" stroke-width="1.2" />
    <text x="95" y="22" class="node-title">4. Page Table Walk</text>
    <text x="95" y="38" class="node-desc">PT_Base + (p2 * 4) ➜ PTE</text>
  </g>

  <!-- Line down to Present in Memory Decision -->
  <line x1="680" y1="332" x2="680" y2="375" class="flow-line flow-anim" marker-end="url(#fArr)" />

  <!-- Decision: Present in RAM? (Valid Bit = 1?) -->
  <g transform="translate(680, 415)">
    <polygon points="0 -38, 68 0, 0 38, -68 0" fill="url(#nDecision)" stroke="#fbbf24" stroke-width="1.5" />
    <text x="0" y="-6" class="diamond-txt">Page Present?</text>
    <text x="0" y="12" class="diamond-sub">Valid Bit == 1</text>
  </g>

  <!-- Branch YES (Page in RAM) -> Update TLB and form PA -->
  <path d="M 748 415 L 795 415 L 795 240 L 760 240" class="flow-green" marker-end="url(#fArrG)" />
  <text x="752" y="405" class="tag-lbl" fill="#34d399">YES (RAM Hit: 310 ns)</text>

  <!-- Branch NO (Page Fault) Leftwards -->
  <line x1="612" y1="415" x2="480" y2="415" class="flow-red" marker-end="url(#fArrR)" />
  <text x="510" y="405" class="tag-lbl" fill="#f87171">NO (Page Fault!)</text>

  <!-- ========================================================
       PAGE FAULT HANDLING PATH
       ======================================================== -->
  <!-- Node: OS Page Fault Handler -->
  <g transform="translate(290, 390)">
    <rect width="185" height="50" rx="7" fill="url(#nFault)" stroke="#f87171" stroke-width="1.2" />
    <text x="92" y="22" class="node-title">PAGE FAULT EXCEPTION</text>
    <text x="92" y="38" class="node-desc">OS Trap Handler Service</text>
  </g>

  <!-- Line down to Free Frame Decision -->
  <line x1="382" y1="440" x2="382" y2="485" class="flow-line flow-anim" marker-end="url(#fArr)" />

  <!-- Decision: Free Frame Available? -->
  <g transform="translate(382, 525)">
    <polygon points="0 -34, 60 0, 0 34, -60 0" fill="url(#nDecision)" stroke="#fbbf24" stroke-width="1.5" />
    <text x="0" y="-4" class="diamond-txt">Free Frame?</text>
    <text x="0" y="12" class="diamond-sub">&lt; 8 resident</text>
  </g>

  <!-- Free Frame YES -> Allocate directly -->
  <line x1="442" y1="525" x2="520" y2="525" class="flow-green" marker-end="url(#fArrG)" />
  <text x="450" y="515" class="tag-lbl" fill="#34d399">YES</text>

  <g transform="translate(525, 502)">
    <rect width="165" height="46" rx="6" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" />
    <text x="82" y="20" class="node-title" fill="#a7f3d0">Allocate Free Frame</text>
    <text x="82" y="34" class="node-desc" fill="#6ee7b7">Dequeue free_frames</text>
  </g>

  <!-- Free Frame NO -> Evict FIFO victim -->
  <path d="M 322 525 L 210 525 L 210 575" class="flow-red" marker-end="url(#fArrR)" />
  <text x="235" y="515" class="tag-lbl" fill="#f87171">NO (Full)</text>

  <g transform="translate(100, 575)">
    <rect width="220" height="54" rx="6" fill="rgba(239, 68, 68, 0.15)" stroke="#ef4444" stroke-width="1.2" />
    <text x="110" y="22" class="node-title" fill="#fca5a5">FIFO Victim Eviction</text>
    <text x="110" y="36" class="node-desc">Evict oldest resident VPN</text>
    <text x="110" y="48" class="node-desc" fill="#fca5a5">Clear PTE &amp; TLB Entry</text>
  </g>

  <!-- From Eviction & Allocation -> Load page from disk -->
  <path d="M 320 602 L 500 602 L 500 580 L 525 580" class="flow-line flow-anim" marker-end="url(#fArr)" />
  <line x1="607" y1="548" x2="607" y2="575" class="flow-line flow-anim" marker-end="url(#fArr)" />

  <g transform="translate(525, 575)">
    <rect width="195" height="54" rx="7" fill="rgba(6, 182, 212, 0.18)" stroke="#06b6d4" stroke-width="1.2" />
    <text x="97" y="22" class="node-title" fill="#67e8f9">Load Page &amp; Update PTE</text>
    <text x="97" y="36" class="node-desc">Disk I/O (8,000,000 ns)</text>
    <text x="97" y="48" class="node-desc" fill="#a5f3fc">Set Valid = 1, PFN</text>
  </g>

  <!-- From Load Page -> Update TLB & Re-execute -->
  <path d="M 720 602 L 810 602 L 810 490 L 750 490" class="flow-line flow-anim" marker-end="url(#fArr)" />
  <g transform="translate(640, 470)">
    <rect width="180" height="42" rx="6" fill="rgba(139, 92, 246, 0.2)" stroke="#8b5cf6" />
    <text x="90" y="18" class="node-title" fill="#d8b4fe">Insert Page into TLB</text>
    <text x="90" y="32" class="node-desc">Evict LRU if full ➜ Form PA</text>
  </g>

  <!-- Connect to Form Physical Address -->
  <path d="M 730 470 L 730 220 L 755 220" class="flow-line flow-anim" marker-end="url(#fArr)" />
</svg>
