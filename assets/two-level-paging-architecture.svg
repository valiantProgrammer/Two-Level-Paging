<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="100%" height="100%" role="img" aria-labelledby="archTitle archDesc">
  <title id="archTitle">Two-Level Paging and TLB Hardware Architecture</title>
  <desc id="archDesc">Animated hardware pipeline diagram showing CPU, TLB, Page Directory, Page Table, and Physical Memory with animated packet flow and TLB hit bypass.</desc>

  <defs>
    <!-- Background Gradient -->
    <linearGradient id="pBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c16" />
      <stop offset="50%" stop-color="#12162e" />
      <stop offset="100%" stop-color="#080a14" />
    </linearGradient>

    <!-- Block Gradients -->
    <linearGradient id="pCpu" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <linearGradient id="pTlb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>

    <linearGradient id="pPd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0891b2" />
    </linearGradient>

    <linearGradient id="pPt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>

    <linearGradient id="pRam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Markers -->
    <marker id="mArrow" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#94a3b8" />
    </marker>
    <marker id="mGreen" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#10b981" />
    </marker>
    <marker id="mCyan" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#06b6d4" />
    </marker>
  </defs>

  <style>
    @keyframes dashFlow {
      to { stroke-dashoffset: -24; }
    }
    @keyframes packetMove {
      0% { offset-distance: 0%; opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { offset-distance: 100%; opacity: 0; }
    }
    @keyframes pulseStage {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 2px transparent); }
      50% { transform: scale(1.02); filter: drop-shadow(0 0 8px rgba(139, 92, 246, 0.6)); }
    }
    .flow-dash { stroke-dasharray: 6 6; animation: dashFlow 1.2s linear infinite; }
    .flow-dash-green { stroke-dasharray: 6 6; stroke: #10b981; animation: dashFlow 1s linear infinite; }
    .flow-dash-cyan { stroke-dasharray: 6 6; stroke: #06b6d4; animation: dashFlow 1s linear infinite; }
    .stage-card { transition: all 0.3s ease; }
    .pulse-target { animation: pulseStage 3s ease-in-out infinite; transform-origin: center; }

    .title-txt { font-family: 'Inter', system-ui, sans-serif; font-size: 19px; font-weight: 800; fill: #ffffff; }
    .head-txt { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; font-weight: 700; fill: #f8fafc; }
    .sub-txt { font-family: 'Inter', system-ui, sans-serif; font-size: 9.5px; fill: #94a3b8; }
    .mono-t { font-family: 'Fira Code', ui-monospace, monospace; font-size: 9.5px; fill: #cbd5e1; }
    .mono-bold { font-family: 'Fira Code', ui-monospace, monospace; font-size: 11px; font-weight: 700; fill: #ffffff; }
    .legend-txt { font-family: 'Inter', system-ui, sans-serif; font-size: 10px; font-weight: 600; fill: #cbd5e1; }
  </style>

  <!-- Panel Background -->
  <rect width="1200" height="520" rx="14" fill="url(#pBg)" stroke="rgba(139, 92, 246, 0.35)" stroke-width="1.2" />

  <!-- Top Title & Legend Header -->
  <g transform="translate(35, 24)">
    <text x="0" y="16" class="title-txt">Hardware Address Translation Pipeline (32-Bit VA ➜ PA)</text>
    <text x="0" y="32" class="sub-txt">MMU Translation Lookaside Buffer cache, two-level page-table walk, and Physical Frame indexation</text>

    <!-- Legend -->
    <g transform="translate(710, 2)">
      <!-- Selected Entry -->
      <circle cx="8" cy="10" r="5" fill="#10b981" />
      <text x="18" y="14" class="legend-txt">Active Selected Entry</text>

      <!-- Structure -->
      <circle cx="160" cy="10" r="5" fill="#8b5cf6" />
      <text x="170" y="14" class="legend-txt">MMU Table</text>

      <!-- Miss/Fault -->
      <circle cx="260" cy="10" r="5" fill="#ef4444" />
      <text x="270" y="14" class="legend-txt">TLB Miss / Fault</text>

      <!-- Free Frame -->
      <circle cx="380" cy="10" r="5" fill="#64748b" />
      <text x="390" y="14" class="legend-txt">Free Frame</text>
    </g>
  </g>

  <!-- ========================================================
       STAGE 1: CPU (VIRTUAL ADDRESS REQUEST)
       ======================================================== -->
  <g class="stage-card" transform="translate(35, 95)">
    <rect width="145" height="290" rx="10" fill="rgba(18, 24, 48, 0.9)" stroke="rgba(59, 130, 246, 0.5)" stroke-width="1.2" />
    <rect x="0" y="0" width="145" height="32" rx="10" fill="url(#pCpu)" />
    <text x="72" y="20" text-anchor="middle" class="head-txt">1. CPU Core</text>

    <g transform="translate(12, 45)">
      <text x="0" y="12" class="mono-t" fill="#94a3b8">Issues Request:</text>
      <rect x="0" y="20" width="120" height="28" rx="5" fill="rgba(59, 130, 246, 0.15)" stroke="#3b82f6" />
      <text x="60" y="38" text-anchor="middle" class="mono-bold" fill="#60a5fa">0x00012345</text>
    </g>

    <g transform="translate(12, 115)">
      <rect width="120" height="48" rx="5" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.08)" />
      <text x="8" y="16" class="mono-t" fill="#c4b5fd">p1 : 0x0 (Dir)</text>
      <text x="8" y="30" class="mono-t" fill="#93c5fd">p2 : 0x12 (Tbl)</text>
      <text x="8" y="44" class="mono-t" fill="#67e8f9">d  : 0x345 (Off)</text>
    </g>

    <g transform="translate(12, 185)">
      <rect width="120" height="42" rx="5" fill="rgba(139, 92, 246, 0.15)" />
      <text x="60" y="18" text-anchor="middle" class="sub-txt" fill="#c4b5fd">VPN = p1|p2</text>
      <text x="60" y="34" text-anchor="middle" class="mono-bold" fill="#ffffff">0x00012 (18)</text>
    </g>

    <text x="72" y="260" text-anchor="middle" class="sub-txt">Sends VPN to TLB</text>
  </g>

  <!-- Flow Arrow: CPU to TLB -->
  <line x1="180" y1="210" x2="225" y2="210" stroke="#60a5fa" stroke-width="2" marker-end="url(#mArrow)" class="flow-dash" />

  <!-- ========================================================
       STAGE 2: TLB (4 ENTRIES, LRU)
       ======================================================== -->
  <g class="stage-card pulse-target" transform="translate(230, 95)">
    <rect width="185" height="290" rx="10" fill="rgba(18, 24, 48, 0.9)" stroke="rgba(139, 92, 246, 0.6)" stroke-width="1.5" />
    <rect x="0" y="0" width="185" height="32" rx="10" fill="url(#pTlb)" />
    <text x="92" y="20" text-anchor="middle" class="head-txt">2. TLB (4-Way LRU)</text>

    <!-- TLB Cache Slots -->
    <g transform="translate(10, 42)">
      <!-- Header -->
      <text x="10" y="12" class="mono-t" font-weight="700" fill="#94a3b8">VPN</text>
      <text x="75" y="12" class="mono-t" font-weight="700" fill="#94a3b8">PFN</text>
      <text x="125" y="12" class="mono-t" font-weight="700" fill="#94a3b8">Tag</text>

      <!-- Slot 0: MRU (Active Match 0x12 -> Frame 3) -->
      <g transform="translate(0, 18)">
        <rect width="165" height="24" rx="4" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981" stroke-width="1.2" />
        <text x="10" y="16" class="mono-t" font-weight="700" fill="#ffffff">0x00012</text>
        <text x="75" y="16" class="mono-t" font-weight="700" fill="#34d399">0x3</text>
        <text x="125" y="16" class="mono-t" fill="#6ee7b7">MRU</text>
      </g>

      <!-- Slot 1 -->
      <g transform="translate(0, 46)">
        <rect width="165" height="20" rx="4" fill="rgba(255, 255, 255, 0.02)" />
        <text x="10" y="14" class="mono-t">0x00456</text>
        <text x="75" y="14" class="mono-t" fill="#34d399">0x4</text>
        <text x="125" y="14" class="mono-t">#2</text>
      </g>

      <!-- Slot 2 -->
      <g transform="translate(0, 70)">
        <rect width="165" height="20" rx="4" fill="rgba(255, 255, 255, 0.02)" />
        <text x="10" y="14" class="mono-t">0x00A02</text>
        <text x="75" y="14" class="mono-t" fill="#34d399">0x5</text>
        <text x="125" y="14" class="mono-t">#3</text>
      </g>

      <!-- Slot 3 (LRU Victim) -->
      <g transform="translate(0, 94)">
        <rect width="165" height="20" rx="4" fill="rgba(255, 255, 255, 0.02)" />
        <text x="10" y="14" class="mono-t">0x00008</text>
        <text x="75" y="14" class="mono-t" fill="#34d399">0x1</text>
        <text x="125" y="14" class="mono-t" fill="#f87171">LRU</text>
      </g>
    </g>

    <!-- TLB Hit vs Miss Path Markers -->
    <g transform="translate(10, 180)">
      <!-- Hit Shortcut Box -->
      <rect width="165" height="44" rx="5" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" />
      <text x="82" y="18" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#34d399">TLB HIT PATH (110 ns)</text>
      <text x="82" y="34" text-anchor="middle" class="mono-t" fill="#a7f3d0">Bypass PT Walk ➜ PA</text>

      <!-- Miss Path Note -->
      <rect y="50" width="165" height="38" rx="5" fill="rgba(239, 68, 68, 0.12)" stroke="#ef4444" />
      <text x="82" y="66" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#f87171">TLB MISS PATH (310 ns)</text>
      <text x="82" y="80" text-anchor="middle" class="mono-t" fill="#fca5a5">Proceed to Page Walk</text>
    </g>
  </g>

  <!-- TLB Hit Shortcut Overarching Green Line directly to Physical Address -->
  <path d="M 322 95 C 322 55, 960 55, 960 95" fill="none" stroke="#10b981" stroke-width="2.5" marker-end="url(#mGreen)" class="flow-dash-green" />
  <rect x="580" y="44" width="130" height="22" rx="4" fill="rgba(16, 185, 129, 0.25)" stroke="#10b981" />
  <text x="645" y="59" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" font-weight="800" fill="#34d399">TLB HIT SHORTCUT</text>

  <!-- Flow Arrow: TLB Miss to Page Directory -->
  <line x1="415" y1="210" x2="465" y2="210" stroke="#ef4444" stroke-width="2" marker-end="url(#mArrow)" class="flow-dash" />

  <!-- ========================================================
       STAGE 3: PAGE DIRECTORY (LEVEL 1)
       ======================================================== -->
  <g class="stage-card" transform="translate(470, 95)">
    <rect width="180" height="290" rx="10" fill="rgba(18, 24, 48, 0.9)" stroke="rgba(6, 182, 212, 0.5)" stroke-width="1.2" />
    <rect x="0" y="0" width="180" height="32" rx="10" fill="url(#pPd)" />
    <text x="90" y="20" text-anchor="middle" class="head-txt">3. Page Directory</text>

    <!-- CR3 Base Pointer -->
    <g transform="translate(10, 42)">
      <rect width="160" height="26" rx="4" fill="rgba(6, 182, 212, 0.15)" stroke="#06b6d4" />
      <text x="80" y="17" text-anchor="middle" class="mono-bold" fill="#67e8f9">CR3 Register Base</text>
    </g>

    <!-- Directory Entries -->
    <g transform="translate(10, 78)">
      <g transform="translate(0, 0)">
        <rect width="160" height="24" rx="3" fill="rgba(6, 182, 212, 0.25)" stroke="#06b6d4" stroke-width="1.2" />
        <text x="8" y="16" class="mono-t" font-weight="700" fill="#ffffff">PDE[0x0] (p1)</text>
        <text x="110" y="16" class="mono-t" font-weight="700" fill="#67e8f9">PT0</text>
      </g>

      <g transform="translate(0, 30)">
        <rect width="160" height="20" rx="3" fill="rgba(255, 255, 255, 0.02)" />
        <text x="8" y="14" class="mono-t">PDE[0x1]</text>
        <text x="110" y="14" class="mono-t">PT1</text>
      </g>

      <g transform="translate(0, 54)">
        <rect width="160" height="20" rx="3" fill="rgba(255, 255, 255, 0.02)" />
        <text x="8" y="14" class="mono-t">PDE[0x2]</text>
        <text x="110" y="14" class="mono-t">PT2</text>
      </g>

      <text x="80" y="94" text-anchor="middle" class="mono-t" fill="#64748b">...</text>

      <g transform="translate(0, 106)">
        <rect width="160" height="20" rx="3" fill="rgba(255, 255, 255, 0.02)" />
        <text x="8" y="14" class="mono-t" fill="#64748b">PDE[0x3FF]</text>
        <text x="110" y="14" class="mono-t" fill="#64748b">—</text>
      </g>
    </g>

    <g transform="translate(10, 230)">
      <rect width="160" height="44" rx="5" fill="rgba(11, 15, 30, 0.9)" />
      <text x="8" y="16" class="sub-txt">10-bit p1 Index</text>
      <text x="8" y="32" class="mono-t" fill="#38bdf8">PDE Points to PT0</text>
    </g>
  </g>

  <!-- Flow Arrow: Page Directory to Page Table -->
  <line x1="650" y1="210" x2="695" y2="210" stroke="#06b6d4" stroke-width="2" marker-end="url(#mCyan)" class="flow-dash-cyan" />

  <!-- ========================================================
       STAGE 4: PAGE TABLE (LEVEL 2)
       ======================================================== -->
  <g class="stage-card" transform="translate(700, 95)">
    <rect width="180" height="290" rx="10" fill="rgba(18, 24, 48, 0.9)" stroke="rgba(168, 85, 247, 0.5)" stroke-width="1.2" />
    <rect x="0" y="0" width="180" height="32" rx="10" fill="url(#pPt)" />
    <text x="90" y="20" text-anchor="middle" class="head-txt">4. Page Table PT0</text>

    <!-- Table Header -->
    <g transform="translate(10, 42)">
      <text x="8" y="12" class="mono-t" font-weight="700" fill="#94a3b8">Index</text>
      <text x="65" y="12" class="mono-t" font-weight="700" fill="#94a3b8">Frame</text>
      <text x="125" y="12" class="mono-t" font-weight="700" fill="#94a3b8">V</text>

      <!-- Slot 0x00 -->
      <g transform="translate(0, 18)">
        <rect width="160" height="20" rx="3" fill="rgba(255, 255, 255, 0.02)" />
        <text x="8" y="14" class="mono-t">0x00</text>
        <text x="65" y="14" class="mono-t">0x1</text>
        <text x="125" y="14" class="mono-t" fill="#34d399">1</text>
      </g>

      <!-- Active Slot 0x12 (p2 match) -->
      <g transform="translate(0, 42)">
        <rect width="160" height="24" rx="3" fill="rgba(16, 185, 129, 0.25)" stroke="#10b981" stroke-width="1.2" />
        <text x="8" y="16" class="mono-t" font-weight="700" fill="#ffffff">0x12</text>
        <text x="65" y="16" class="mono-t" font-weight="700" fill="#34d399">Frame 0x3</text>
        <text x="125" y="16" class="mono-t" font-weight="700" fill="#34d399">1</text>
      </g>

      <text x="80" y="86" text-anchor="middle" class="mono-t" fill="#64748b">...</text>

      <!-- Slot 0x3FF (Fault Page) -->
      <g transform="translate(0, 98)">
        <rect width="160" height="20" rx="3" fill="rgba(239, 68, 68, 0.08)" />
        <text x="8" y="14" class="mono-t">0x3FF</text>
        <text x="65" y="14" class="mono-t">—</text>
        <text x="125" y="14" class="mono-t" fill="#f87171">0</text>
      </g>
    </g>

    <!-- Valid Bit Check Notice -->
    <g transform="translate(10, 195)">
      <rect width="160" height="42" rx="5" fill="rgba(11, 15, 30, 0.9)" />
      <text x="8" y="16" font-family="'Inter', sans-serif" font-size="9.5" font-weight="700" fill="#34d399">Valid = 1 ➜ Resident</text>
      <text x="8" y="32" font-family="'Inter', sans-serif" font-size="9.5" font-weight="700" fill="#f87171">Valid = 0 ➜ Page Fault</text>
    </g>

    <text x="90" y="265" text-anchor="middle" class="sub-txt">Produces Frame #0x3</text>
  </g>

  <!-- Flow Arrow: Page Table to Physical RAM -->
  <line x1="880" y1="210" x2="925" y2="210" stroke="#a855f7" stroke-width="2" marker-end="url(#mArrow)" class="flow-dash" />

  <!-- ========================================================
       STAGE 5: PHYSICAL MEMORY (RAM, 8 FRAMES)
       ======================================================== -->
  <g class="stage-card" transform="translate(930, 95)">
    <rect width="235" height="290" rx="10" fill="rgba(18, 24, 48, 0.9)" stroke="rgba(16, 185, 129, 0.6)" stroke-width="1.5" />
    <rect x="0" y="0" width="235" height="32" rx="10" fill="url(#pRam)" />
    <text x="117" y="20" text-anchor="middle" class="head-txt">5. Physical RAM (8 Frames)</text>

    <!-- Frame Stack -->
    <g transform="translate(10, 42)">
      <!-- Frame 0 -->
      <rect width="215" height="18" rx="3" fill="rgba(255, 255, 255, 0.02)" />
      <text x="8" y="13" class="mono-t">F0: Free</text>

      <!-- Frame 1 -->
      <g transform="translate(0, 22)">
        <rect width="215" height="18" rx="3" fill="rgba(255, 255, 255, 0.02)" />
        <text x="8" y="13" class="mono-t">F1: Free</text>
      </g>

      <!-- Frame 2 -->
      <g transform="translate(0, 44)">
        <rect width="215" height="18" rx="3" fill="rgba(255, 255, 255, 0.02)" />
        <text x="8" y="13" class="mono-t">F2: Free</text>
      </g>

      <!-- Frame 3 (ACTIVE HIT FRAME) -->
      <g transform="translate(0, 66)">
        <rect width="215" height="22" rx="4" fill="rgba(16, 185, 129, 0.25)" stroke="#10b981" stroke-width="1.2" />
        <text x="8" y="15" class="mono-t" font-weight="700" fill="#34d399">F3: VPN 0x12 (Target Frame)</text>
      </g>

      <!-- Frame 4 -->
      <g transform="translate(0, 92)">
        <rect width="215" height="18" rx="3" fill="rgba(59, 130, 246, 0.15)" />
        <text x="8" y="13" class="mono-t" fill="#93c5fd">F4: VPN 0x456</text>
      </g>

      <!-- Frame 5 -->
      <g transform="translate(0, 114)">
        <rect width="215" height="18" rx="3" fill="rgba(59, 130, 246, 0.15)" />
        <text x="8" y="13" class="mono-t" fill="#93c5fd">F5: VPN 0xA02</text>
      </g>
    </g>

    <!-- FIFO Policy Box -->
    <g transform="translate(10, 195)">
      <rect width="215" height="42" rx="5" fill="rgba(11, 15, 30, 0.9)" />
      <text x="8" y="16" font-family="'Inter', sans-serif" font-size="9.5" font-weight="700" fill="#fbbf24">FIFO Page Replacement</text>
      <text x="8" y="32" class="sub-txt">Evicts oldest resident frame on fault</text>
    </g>

    <text x="117" y="265" text-anchor="middle" class="mono-bold" fill="#34d399">PFN = 0x3 (3)</text>
  </g>

  <!-- ========================================================
       BOTTOM BANNER: FINAL PHYSICAL ADDRESS & TIMING
       ======================================================== -->
  <g transform="translate(35, 410)">
    <rect width="1130" height="85" rx="10" fill="rgba(18, 24, 48, 0.95)" stroke="rgba(16, 185, 129, 0.5)" stroke-width="1.5" />
    
    <g transform="translate(20, 20)">
      <text x="0" y="18" class="head-txt" font-size="14">Final Physical Address (PA) Assembly:</text>
      <text x="0" y="44" font-family="'Fira Code', monospace" font-size="14" font-weight="700" fill="#ffffff">
        PA = (PFN &lt;&lt; 12) | Offset = (<tspan fill="#34d399">0x3</tspan> &lt;&lt; 12) | <tspan fill="#22d3ee">0x345</tspan> = <tspan fill="#10b981" font-weight="800">0x00003345</tspan>
      </text>
    </g>

    <g transform="translate(680, 15)">
      <rect width="430" height="55" rx="6" fill="rgba(10, 14, 28, 0.9)" stroke="rgba(255, 255, 255, 0.08)" />
      <text x="12" y="18" font-family="'Fira Code', monospace" font-size="10" fill="#38bdf8">• TLB Hit: 10 ns (TLB) + 100 ns (Mem) = 110 ns</text>
      <text x="12" y="34" font-family="'Fira Code', monospace" font-size="10" fill="#c4b5fd">• TLB Miss: 10 ns + 2×100 ns (PTs) + 100 ns = 310 ns</text>
      <text x="12" y="50" font-family="'Fira Code', monospace" font-size="10" fill="#f87171">• Page Fault: 310 ns + 8,000,000 ns (Disk I/O) = 8,000,310 ns</text>
    </g>
  </g>
</svg>
